name: whispershortcut-local-stt
services:
  transcription:
    build:
      context: ./apps/linux/services/transcription
    ports:
      - "127.0.0.1:8765:8000"
    cpus: 4
    mem_limit: 4g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
